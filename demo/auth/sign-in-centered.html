<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazana Strata — Auth Kit (Centered)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/auth.css" rel="stylesheet">
</head>
<body class="auth centered">

<button class="auth-toggle" data-theme-toggle="dark-knight,desert-dunes" aria-label="Switch theme"><i class="fa-solid fa-sun"></i></button>

<main class="auth-main">
  <div class="auth-card">
    <a class="brand" href="../site/landing.html">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      Qazan<span class="mk">a</span>
    </a>

    <h1>Sign in</h1>
    <p class="sub">New here? <a href="sign-up.html">Create an account</a></p>

    <div class="oauth">
      <button class="btn btn-oauth"><i class="fa-brands fa-google"></i> Google</button>
      <button class="btn btn-oauth"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>
    <div class="divider">or continue with email</div>

    <form onsubmit="return false">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" value="ada@lovelace.io">
      </div>
      <div class="field">
        <div class="row-between"><label for="pw">Password</label><a href="reset.html">Forgot?</a></div>
        <div class="pw">
          <input id="pw" type="password" placeholder="••••••••" value="hunter2horse">
          <button type="button" data-pw-toggle>SHOW</button>
        </div>
      </div>
      <label class="remember"><input type="checkbox" checked> Keep me signed in</label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <p class="auth-foot">Protected by reCAPTCHA · <a href="#">Privacy</a> &amp; <a href="#">Terms</a></p>
  </div>
</main>

<script src="../../js/qazana.js" defer></script>
</body>
</html>
