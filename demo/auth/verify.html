<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazana Strata — Auth (Verify email)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/auth.css" rel="stylesheet">
</head>
<body class="auth centered">
<button class="auth-toggle" data-theme-toggle="dark-knight,desert-dunes" aria-label="Switch theme"><i class="fa-solid fa-sun"></i></button>
<main class="auth-main">
  <div class="auth-card" style="text-align:center">
    <a class="brand" href="../site/landing.html" style="justify-content:center"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg> Qazan<span class="mk">a</span></a>
    <div class="icon-badge"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>Verify your email</h1>
    <p class="sub" style="margin-bottom:8px">Enter the 6-digit code we sent to</p>
    <span class="sent-to">ada@lovelace.io</span>
    <form onsubmit="return false">
      <div class="otp" data-otp>
        <input maxlength="1" inputmode="numeric" autocomplete="one-time-code" value="4" aria-label="Digit 1">
        <input maxlength="1" inputmode="numeric" value="8" aria-label="Digit 2">
        <input maxlength="1" inputmode="numeric" aria-label="Digit 3">
        <input maxlength="1" inputmode="numeric" aria-label="Digit 4">
        <input maxlength="1" inputmode="numeric" aria-label="Digit 5">
        <input maxlength="1" inputmode="numeric" aria-label="Digit 6">
      </div>
      <button class="btn btn-primary" type="submit">Verify</button>
    </form>
    <p class="auth-foot">Didn't get a code? <a href="#">Resend</a> · <a href="sign-in.html">Back</a></p>
  </div>
</main>
<script src="../../js/qazana.js" defer></script>
</body></html>
