<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazana Strata — Auth Kit (Reset)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/auth.css" rel="stylesheet">
</head>
<body class="auth">

<button class="auth-toggle" data-theme-toggle="dark-knight,desert-dunes" aria-label="Switch theme"><i class="fa-solid fa-sun"></i></button>

<aside class="auth-brand">
  <a class="brand" href="../site/landing.html">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    Qazan<span class="mk">a</span>
  </a>
  <div class="auth-pitch">
    <h2>Forgot your password?</h2>
    <p>It happens. Enter your email and we'll send a secure link to reset it.</p>
  </div>
</aside>

<main class="auth-main">
  <div class="auth-card">
    <a class="brand" href="../site/landing.html">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      Qazan<span class="mk">a</span>
    </a>
    <h1>Reset password</h1>
    <p class="sub">We'll email you a link to set a new one.</p>

    <form onsubmit="return false">
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" value="ada@lovelace.io"></div>
      <a class="btn btn-primary" href="check-email.html">Send reset link</a>
    </form>

    <p class="auth-foot"><a href="sign-in.html"><i class="fa-solid fa-arrow-left-long"></i> Back to sign in</a></p>
  </div>
</main>

<script src="../../js/qazana.js" defer></script>
<script src="../demo-nav.js" defer></script>
</body>
</html>
