<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazana Strata — Auth (New password)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/auth.css" rel="stylesheet">
</head>
<body class="auth centered">
<button class="auth-toggle" data-theme-toggle="dark-knight,desert-dunes" aria-label="Switch theme"><i class="fa-solid fa-sun"></i></button>
<main class="auth-main">
  <div class="auth-card">
    <a class="brand" href="../site/landing.html"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg> Qazan<span class="mk">a</span></a>
    <h1>Set a new password</h1>
    <p class="sub">Choose a strong password you don't use elsewhere.</p>
    <form onsubmit="return false">
      <div class="field"><label for="pw">New password</label>
        <div class="pw"><input id="pw" type="password" data-pw-strength placeholder="At least 8 characters"><button type="button" data-pw-toggle>SHOW</button></div>
        <div class="pwbar"><i></i></div><span class="pwhint"></span>
      </div>
      <div class="field"><label for="pw2">Confirm password</label>
        <div class="pw"><input id="pw2" type="password" placeholder="Re-enter password"><button type="button" data-pw-toggle>SHOW</button></div>
      </div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
    <p class="auth-foot"><a href="sign-in.html"><i class="fa-solid fa-arrow-left-long"></i> Back to sign in</a></p>
  </div>
</main>
<script src="../../js/qazana.js" defer></script>
</body></html>
