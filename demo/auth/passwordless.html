<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazana Strata — Auth (Passwordless)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/auth.css" rel="stylesheet">
</head>
<body class="auth centered">
<button class="auth-toggle" data-theme-toggle="dark-knight,desert-dunes" aria-label="Switch theme"><i class="fa-solid fa-sun"></i></button>
<main class="auth-main">
  <div class="auth-card" style="text-align:center">
    <a class="brand" href="../site/landing.html" style="justify-content:center"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--primary)"/><circle cx="14.5" cy="15" r="7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".95"/><path d="M19 19.5 L24 24.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg> Qazana</a>
    <div class="icon-badge"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h1>Sign in without a password</h1>
    <p class="sub">Enter your email and we'll send a one-time sign-in link — no password needed.</p>
    <form onsubmit="return false" style="text-align:left">
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" value="ada@lovelace.io"></div>
      <a class="btn btn-primary" href="check-email.html"><i class="fa-solid fa-paper-plane"></i> Email me a link</a>
    </form>
    <div class="divider">or</div>
    <a class="btn btn-quiet" href="sign-in.html">Use a password instead</a>
    <p class="auth-foot">New here? <a href="sign-up.html">Create an account</a></p>
  </div>
</main>
<script src="../../js/qazana.js" defer></script>
<script src="../demo-nav.js" defer></script>
</body></html>
