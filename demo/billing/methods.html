<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing — Payment methods · Qazana Strata</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="../../kits/billing.css" rel="stylesheet">
<style>
  body{margin:0}
  .page-wrap{max-width:760px;margin-inline:auto;padding:var(--space-5)}
  .demo-nav{display:flex;gap:var(--space-3);margin-bottom:var(--space-6);flex-wrap:wrap}
  .demo-nav a{font-size:var(--text-sm);color:var(--primary-bright);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:var(--radius)}
  .demo-nav a:hover{border-color:var(--primary);color:var(--primary)}
  .demo-nav a.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
  .section-label{font-size:var(--text-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:var(--space-7) 0 var(--space-4)}
  .stack{display:flex;flex-direction:column;gap:var(--space-3)}
</style>
</head>
<body class="billing" style="background:var(--bg);min-height:100vh">

<div class="page-wrap">

  <nav class="demo-nav" aria-label="Billing demo pages">
    <a href="../index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> All demos</a>
    <a href="plans.html">Plans</a>
    <a href="overview.html">Overview</a>
    <a href="methods.html" class="active">Payment methods</a>
    <a href="invoices.html">Invoices</a>
  </nav>

  <h1 class="section-label">Payment methods</h1>

  <div class="stack">
    <div class="pay-methods">

      <!-- Default card (server state — not a radio selection) -->
      <div class="pay-method default">
        <span class="brand" aria-hidden="true"><i class="fa-brands fa-cc-visa"></i></span>
        <div class="pm-info">
          <div class="pm-num">Visa <span class="dots">•••• 4242</span> <span class="badge paid">Default</span></div>
          <div class="pm-exp">Expires 08 / 2027</div>
        </div>
        <div class="pm-actions">
          <button type="button" class="btn btn-ghost btn-sm">Edit</button>
        </div>
      </div>

      <!-- Secondary card -->
      <div class="pay-method">
        <span class="brand" aria-hidden="true"><i class="fa-brands fa-cc-mastercard"></i></span>
        <div class="pm-info">
          <div class="pm-num">Mastercard <span class="dots">•••• 5510</span></div>
          <div class="pm-exp">Expires 11 / 2026</div>
        </div>
        <div class="pm-actions">
          <button type="button" class="btn btn-secondary btn-sm">Set as default</button>
          <button type="button" class="btn btn-ghost btn-sm">Remove</button>
        </div>
      </div>

      <!-- Expired card -->
      <div class="pay-method">
        <span class="brand" aria-hidden="true"><i class="fa-brands fa-cc-amex"></i></span>
        <div class="pm-info">
          <div class="pm-num">Amex <span class="dots">•••• 1009</span></div>
          <div class="pm-exp expired"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Expired 02 / 2026</div>
        </div>
        <div class="pm-actions">
          <button type="button" class="btn btn-ghost btn-sm">Remove</button>
        </div>
      </div>

    </div>

    <button type="button" class="pay-add">
      <i class="fa-solid fa-plus" aria-hidden="true"></i> Add payment method
    </button>
  </div>

</div><!-- /page-wrap -->

<script src="../../js/qazana.js" defer></script>
<script src="../demo-nav.js" defer></script>
</body>
</html>
