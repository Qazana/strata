name: Release

# Publish @qazana/strata to npm when a version tag is pushed.
# Requires the NPM_TOKEN secret created by the qazana org owner (qazana-hd):
# a token that bypasses 2FA on publish — a classic Automation token, or a
# granular token with 2FA-bypass enabled and read/write on @qazana packages.
# The account enforces 2FA for writes, so a plain granular token gets a 403.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for `npm publish --provenance` below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package $PKG"; exit 1; }

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
